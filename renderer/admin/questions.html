
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت بانک سوالات</title>
    <link rel="stylesheet" href="../css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- سایدبار (دقیقاً مثل داشبورد) -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar vh-100 position-fixed">
                <div class="p-3 text-center border-bottom border-secondary">
                    <img src="../assets/logo.png" alt="Logo" height="50" class="mb-2">
                    <h5 class="text-white">مدیریت آزمون</h5>
                </div>
                <ul class="nav flex-column mt-3">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> داشبورد</a></li>
                    <li class="nav-item"><a class="nav-link active" href="questions.html"><i class="bi bi-question-circle"></i> بانک سوالات</a></li>
                    <li class="nav-item"><a class="nav-link" href="exams.html"><i class="bi bi-file-text"></i> آزمون‌ها</a></li>
                    <li class="nav-item"><a class="nav-link" href="participants.html"><i class="bi bi-people"></i> شرکت‌کنندگان</a></li>
                    <li class="nav-item"><a class="nav-link" href="reports.html"><i class="bi bi-bar-chart-line"></i> گزارشات</a></li>
                    <li class="nav-item mt-4"><a class="nav-link text-danger" id="logoutBtn" href="#"><i class="bi bi-box-arrow-left"></i> خروج</a></li>
                </ul>
            </nav>

            <!-- محتوای اصلی -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4" style="margin-right: 16.6%;">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">مدیریت بانک سوالات</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <button class="btn btn-sm btn-success me-2" data-bs-toggle="modal" data-bs-target="#questionModal" id="addNewBtn">
                            <i class="bi bi-plus-circle"></i> سوال جدید
                        </button>
                        <button class="btn btn-sm btn-outline-primary me-2" id="importBtn">
                            <i class="bi bi-upload"></i> Import
                        </button>
                        <button class="btn btn-sm btn-outline-secondary" id="exportBtn">
                            <i class="bi bi-download"></i> Export
                        </button>
                        <input type="file" id="fileInput" accept=".xlsx,.csv,.json" style="display:none">
                    </div>
                </div>

                <!-- نوار فیلتر و جستجو -->
                <div class="row g-2 mb-3">
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="searchInput" placeholder="جستجوی متن سوال...">
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="filterCategory">
                            <option value="">همه دسته‌بندی‌ها</option>
                            <option value="ریاضی">ریاضی</option>
                            <option value="فیزیک">فیزیک</option>
                            <option value="شیمی">شیمی</option>
                            <option value="زبان">زبان</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="filterDifficulty">
                            <option value="">همه سطوح</option>
                            <option value="آسان">آسان</option>
                            <option value="متوسط">متوسط</option>
                            <option value="سخت">سخت</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="filterType">
                            <option value="">همه انواع</option>
                            <option value="چهارگزینه‌ای">چهارگزینه‌ای</option>
                            <option value="چند پاسخ صحیح">چند پاسخ صحیح</option>
                            <option value="درست/غلط">درست/غلط</option>
                            <option value="تشریحی">تشریحی</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary w-100" id="applyFilterBtn"><i class="bi bi-funnel"></i> اعمال فیلتر</button>
                    </div>
                </div>

                <!-- جدول سوالات -->
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>#</th>
                                        <th>متن سوال</th>
                                        <th>دسته‌بندی</th>
                                        <th>سطح</th>
                                        <th>نوع</th>
                                        <th>نمره</th>
                                        <th>عملیات</th>
                                    </tr>
                                </thead>
                                <tbody id="questionsTableBody">
                                    <tr><td colspan="7" class="text-center py-4">در حال بارگذاری...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- ========== مودال افزودن/ویرایش سوال ========== -->
    <div class="modal fade" id="questionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">افزودن سوال جدید</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="questionForm">
                        <input type="hidden" id="editId" value="">

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">دسته‌بندی</label>
                                <select class="form-select" id="qCategory" required>
                                    <option value="ریاضی">ریاضی</option>
                                    <option value="فیزیک">فیزیک</option>
                                    <option value="شیمی">شیمی</option>
                                    <option value="زبان">زبان</option>
                                    <option value="عمومی">عمومی</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">موضوع</label>
                                <input type="text" class="form-control" id="qSubject" placeholder="مثل: معادلات دیفرانسیل">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">سطح سختی</label>
                                <select class="form-select" id="qDifficulty" required>
                                    <option value="آسان">آسان</option>
                                    <option value="متوسط" selected>متوسط</option>
                                    <option value="سخت">سخت</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-3">
                            <label class="form-label">نوع سوال</label>
                            <select class="form-select" id="qType" required>
                                <option value="چهارگزینه‌ای">چهارگزینه‌ای</option>
                                <option value="چند پاسخ صحیح">چند پاسخ صحیح</option>
                                <option value="درست/غلط">درست/غلط</option>
                                <option value="تشریحی">تشریحی</option>
                            </select>
                        </div>

                        <div class="mt-3">
                            <label class="form-label">متن سوال</label>
                            <textarea class="form-control" id="qText" rows="2" required placeholder="متن سوال را وارد کنید..."></textarea>
                        </div>

                        <div class="row g-3 mt-2">
                            <div class="col-md-6">
                                <label class="form-label">گزینه A</label>
                                <input type="text" class="form-control" id="qOptA" placeholder="متن گزینه A">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">گزینه B</label>
                                <input type="text" class="form-control" id="qOptB" placeholder="متن گزینه B">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">گزینه C</label>
                                <input type="text" class="form-control" id="qOptC" placeholder="متن گزینه C">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">گزینه D</label>
                                <input type="text" class="form-control" id="qOptD" placeholder="متن گزینه D">
                            </div>
                        </div>

                        <div class="row g-3 mt-2">
                            <div class="col-md-6">
                                <label class="form-label">پاسخ صحیح <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="qCorrect" required placeholder="مثلاً: A یا A,B برای چندگزینه">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">نمره</label>
                                <input type="number" class="form-control" id="qScore" value="1" min="1">
                            </div>
                        </div>

                        <div class="mt-3">
                            <label class="form-label">توضیح (اختیاری)</label>
                            <textarea class="form-control" id="qExplanation" rows="2" placeholder="توضیح پاسخ صحیح..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
                    <button type="button" class="btn btn-primary" id="saveQuestionBtn">ذخیره سوال</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS و Popper -->
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script>
        // ============================================================
        //  تمام کدهای جاوااسکریپت مربوط به این صفحه (مدیریت سوالات)
        // ============================================================
        const { db, checkSession, logoutAdmin } = window.electronAPI;

        // 1. بررسی سشن ادمین
        checkSession().then(result => {
            if (!result.loggedIn) window.location.href = '../index.html';
        });

        // 2. خروج
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await logoutAdmin();
            window.location.href = '../index.html';
        });

        // 3. متغیرهای عمومی
        const tbody = document.getElementById('questionsTableBody');
        let currentQuestions = [];

        // 4. تابع بارگذاری سوالات
        async function loadQuestions(filter = null) {
            try {
                let data;
                if (filter) {
                    data = await db.getQuestionsByFilter(filter);
                } else {
                    data = await db.getAllQuestions();
                }
                currentQuestions = data;
                renderTable(data);
            } catch (err) {
                console.error('خطا:', err);
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">خطا در بارگذاری</td></tr>`;
            }
        }

        // 5. رندر جدول
        function renderTable(questions) {
            if (!questions || questions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4">هیچ سوالی یافت نشد</td></tr>`;
                return;
            }
            let html = '';
            questions.forEach((q, index) => {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${q.question_text.substring(0, 50)}${q.question_text.length > 50 ? '...' : ''}</td>
                        <td>${q.category || '-'}</td>
                        <td><span class="badge ${q.difficulty === 'سخت' ? 'bg-danger' : q.difficulty === 'متوسط' ? 'bg-warning' : 'bg-success'}">${q.difficulty}</span></td>
                        <td>${q.question_type}</td>
                        <td>${q.score}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary me-1 edit-btn" data-id="${q.id}"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${q.id}"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;

            // اتصال رویدادهای دکمه‌ها
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', () => editQuestion(btn.dataset.id));
            });
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => deleteQuestion(btn.dataset.id));
            });
        }

        // 6. افزودن سوال جدید (ذخیره)
        document.getElementById('saveQuestionBtn').addEventListener('click', async () => {
            const editId = document.getElementById('editId').value;
            const data = {
                category: document.getElementById('qCategory').value,
                subject: document.getElementById('qSubject').value,
                difficulty: document.getElementById('qDifficulty').value,
                question_type: document.getElementById('qType').value,
                question_text: document.getElementById('qText').value,
                option_a: document.getElementById('qOptA').value,
                option_b: document.getElementById('qOptB').value,
                option_c: document.getElementById('qOptC').value,
                option_d: document.getElementById('qOptD').value,
                correct_answer: document.getElementById('qCorrect').value,
                score: parseInt(document.getElementById('qScore').value) || 1,
                explanation: document.getElementById('qExplanation').value
            };

            // اعتبارسنجی ساده
            if (!data.question_text || !data.correct_answer) {
                alert('متن سوال و پاسخ صحیح اجباری هستند!');
                return;
            }

            try {
                let result;
                if (editId) {
                    // ویرایش
                    result = await db.updateQuestion(parseInt(editId), data);
                } else {
                    // افزودن
                    result = await db.addQuestion(data);
                }
                if (result.success) {
                    // بستن مودال
                    const modal = bootstrap.Modal.getInstance(document.getElementById('questionModal'));
                    modal.hide();
                    // بارگذاری مجدد جدول
                    loadQuestions();
                    // ریست فرم
                    document.getElementById('questionForm').reset();
                    document.getElementById('editId').value = '';
                    document.getElementById('modalTitle').textContent = 'افزودن سوال جدید';
                } else {
                    alert('خطا: ' + result.message);
                }
            } catch (err) {
                alert('خطای سیستمی: ' + err.message);
            }
        });

        // 7. ویرایش سوال (پر کردن فرم)
        async function editQuestion(id) {
            const q = currentQuestions.find(item => item.id == id);
            if (!q) return;

            document.getElementById('editId').value = q.id;
            document.getElementById('modalTitle').textContent = 'ویرایش سوال';
            document.getElementById('qCategory').value = q.category || 'ریاضی';
            document.getElementById('qSubject').value = q.subject || '';
            document.getElementById('qDifficulty').value = q.difficulty || 'متوسط';
            document.getElementById('qType').value = q.question_type || 'چهارگزینه‌ای';
            document.getElementById('qText').value = q.question_text || '';
            document.getElementById('qOptA').value = q.option_a || '';
            document.getElementById('qOptB').value = q.option_b || '';
            document.getElementById('qOptC').value = q.option_c || '';
            document.getElementById('qOptD').value = q.option_d || '';
            document.getElementById('qCorrect').value = q.correct_answer || '';
            document.getElementById('qScore').value = q.score || 1;
            document.getElementById('qExplanation').value = q.explanation || '';

            const modal = new bootstrap.Modal(document.getElementById('questionModal'));
            modal.show();
        }

        // 8. حذف سوال
        async function deleteQuestion(id) {
            if (!confirm('آیا از حذف این سوال اطمینان دارید؟')) return;
            try {
                const result = await db.deleteQuestion(id);
                if (result.success) {
                    loadQuestions();
                } else {
                    alert('خطا در حذف: ' + result.message);
                }
            } catch (err) {
                alert('خطا: ' + err.message);
            }
        }

        // 9. فیلتر و جستجو
        document.getElementById('applyFilterBtn').addEventListener('click', () => {
            const filter = {
                category: document.getElementById('filterCategory').value,
                difficulty: document.getElementById('filterDifficulty').value,
                question_type: document.getElementById('filterType').value,
            };
            // جستجوی متن (اگر بخواهیم دقیق باشیم باید در سرویس سمت سرور پیاده کنیم، ولی فعلاً با getAll ساده می‌گیریم)
            // برای نمونه ساده، اگر فیلتری انتخاب شده بود از فیلتر استفاده کن، وگرنه همه را بگیر
            loadQuestions(filter);
        });

        // دکمه نمایش همه (با پاک کردن فیلترها)
        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('applyFilterBtn').click();
            }
        });

        // 10. افزودن با دکمه "سوال جدید" (مودال را خالی می‌کند)
        document.getElementById('addNewBtn').addEventListener('click', () => {
            document.getElementById('questionForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('modalTitle').textContent = 'افزودن سوال جدید';
            // تنظیم پیش‌فرض‌ها
            document.getElementById('qScore').value = 1;
        });

        // 11. Import و Export (ساده)
        document.getElementById('exportBtn').addEventListener('click', async () => {
            // درخواست ذخیره فایل از main
            const result = await window.electronAPI.db.exportQuestions();
            if (result) {
                // دانلود خودکار (با استفاده از دیتا URI) - فعلاً پیام بده
                alert('خروجی Excel در پوشه برنامه ذخیره شد.');
            }
        });

        document.getElementById('importBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            // ارسال فایل به سرور برای پردازش
            // (کد آن را بعداً اضافه می‌کنیم)
            alert('فایل ' + file.name + ' انتخاب شد. (عملیات Import در حال توسعه)');
            e.target.value = ''; // ریست
        });

        // بارگذاری اولیه
        loadQuestions();

        // برای بسته شدن مودال، اگر کاربر روی دکمه انصراف زد، فرم ریست نشود (اختیاری)
        document.getElementById('questionModal').addEventListener('hidden.bs.modal', function () {
            // اگر می‌خواهید فرم ریست شود، خط زیر را فعال کنید:
            // document.getElementById('questionForm').reset();
        });
    </script>
</body>
</html>
