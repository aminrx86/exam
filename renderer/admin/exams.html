<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت آزمون‌ها</title>
    <link rel="stylesheet" href="../css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- سایدبار یکسان -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar vh-100 position-fixed">
                <div class="p-3 text-center border-bottom border-secondary">
                    <img src="../assets/logo.png" alt="Logo" height="50" class="mb-2">
                    <h5 class="text-white">مدیریت آزمون</h5>
                </div>
                <ul class="nav flex-column mt-3">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> داشبورد</a></li>
                    <li class="nav-item"><a class="nav-link" href="questions.html"><i class="bi bi-question-circle"></i> بانک سوالات</a></li>
                    <li class="nav-item"><a class="nav-link active" href="exams.html"><i class="bi bi-file-text"></i> آزمون‌ها</a></li>
                    <li class="nav-item"><a class="nav-link" href="participants.html"><i class="bi bi-people"></i> شرکت‌کنندگان</a></li>
                    <li class="nav-item"><a class="nav-link" href="reports.html"><i class="bi bi-bar-chart-line"></i> گزارشات</a></li>
                    <li class="nav-item mt-4"><a class="nav-link text-danger" id="logoutBtn" href="#"><i class="bi bi-box-arrow-left"></i> خروج</a></li>
                </ul>
            </nav>

            <!-- محتوای اصلی -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4" style="margin-right: 16.6%;">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">مدیریت آزمون‌ها</h1>
                    <div class="btn-toolbar">
                        <button class="btn btn-sm btn-success" data-bs-toggle="modal" data-bs-target="#createExamModal">
                            <i class="bi bi-plus-circle"></i> آزمون جدید
                        </button>
                    </div>
                </div>

                <!-- جدول آزمون‌ها -->
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>عنوان</th>
                                    <th>تعداد سوال</th>
                                    <th>مدت (دقیقه)</th>
                                    <th>نوع</th>
                                    <th>تاریخ ایجاد</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody id="examsTableBody">
                                <tr><td colspan="7" class="text-center py-4">در حال بارگذاری...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- ========== مودال ایجاد آزمون ========== -->
    <div class="modal fade" id="createExamModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">ایجاد آزمون جدید</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="examForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">عنوان آزمون <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="examTitle" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">مدت زمان (دقیقه) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="examDuration" value="30" min="1" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">توضیحات</label>
                                <textarea class="form-control" id="examDesc" rows="2"></textarea>
                            </div>
                        </div>

                        <hr>
                        <h6 class="mt-3">نحوه انتخاب سوالات</h6>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="selectionMode" id="modeManual" value="manual" checked>
                            <label class="form-check-label" for="modeManual">انتخاب دستی سوالات</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="selectionMode" id="modeRandom" value="random">
                            <label class="form-check-label" for="modeRandom">تولید تصادفی بر اساس دسته‌بندی و سطح</label>
                        </div>

                        <!-- بخش دستی -->
                        <div id="manualSection" class="mt-3">
                            <label class="form-label">سوالات را انتخاب کنید</label>
                            <select class="form-select" id="questionSelector" multiple size="5" style="height: 150px;">
                                <!-- با جاوااسکریپت پر می‌شود -->
                            </select>
                            <div class="mt-2">
                                <button type="button" class="btn btn-sm btn-outline-primary" id="selectAllBtn">انتخاب همه</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary" id="deselectAllBtn">لغو انتخاب</button>
                            </div>
                        </div>

                        <!-- بخش تصادفی -->
                        <div id="randomSection" class="mt-3" style="display:none;">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">دسته‌بندی</label>
                                    <select class="form-select" id="randomCategory">
                                        <option value="ریاضی">ریاضی</option>
                                        <option value="فیزیک">فیزیک</option>
                                        <option value="شیمی">شیمی</option>
                                        <option value="زبان">زبان</option>
                                        <option value="عمومی">عمومی</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">تعداد کل سوالات</label>
                                    <input type="number" class="form-control" id="randomTotal" value="20" min="1">
                                </div>
                            </div>
                            <div class="row g-3 mt-1">
                                <div class="col-md-4">
                                    <label class="form-label">تعداد آسان</label>
                                    <input type="number" class="form-control" id="randomEasy" value="5" min="0">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">تعداد متوسط</label>
                                    <input type="number" class="form-control" id="randomMedium" value="10" min="0">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">تعداد سخت</label>
                                    <input type="number" class="form-control" id="randomHard" value="5" min="0">
                                </div>
                            </div>
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="shuffleQuestions" checked>
                                <label class="form-check-label" for="shuffleQuestions">ترتیب سوالات تصادفی شود</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="shuffleOptions" checked>
                                <label class="form-check-label" for="shuffleOptions">ترتیب گزینه‌ها تصادفی شود</label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary mt-4 w-100" id="createExamBtn">ایجاد آزمون</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script>
        const { db, checkSession, logoutAdmin } = window.electronAPI;

        // بررسی سشن
        checkSession().then(result => {
            if (!result.loggedIn) window.location.href = '../index.html';
        });

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await logoutAdmin();
            window.location.href = '../index.html';
        });

        // ========== بارگذاری لیست آزمون‌ها ==========
        const tbody = document.getElementById('examsTableBody');
        let allExams = [];

        async function loadExams() {
            try {
                const data = await db.getAllExams();
                allExams = data;
                renderExams(data);
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">خطا در بارگذاری</td></tr>`;
            }
        }

        function renderExams(exams) {
            if (!exams || exams.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4">هیچ آزمونی ایجاد نشده است</td></tr>`;
                return;
            }
            let html = '';
            exams.forEach((exam, i) => {
                html += `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${exam.title}</td>
                        <td>${exam.total_questions}</td>
                        <td>${exam.duration}</td>
                        <td>${exam.is_random ? 'تصادفی' : 'دستی'}</td>
                        <td>${new Date(exam.created_date).toLocaleDateString('fa-IR')}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-danger delete-exam" data-id="${exam.id}"><i class="bi bi-trash"></i></button>
                            <!-- در آینده دکمه مشاهده و ویرایش -->
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            // رویداد حذف
            document.querySelectorAll('.delete-exam').forEach(btn => {
                btn.addEventListener('click', () => deleteExam(btn.dataset.id));
            });
        }

        async function deleteExam(id) {
            if (!confirm('آیا از حذف این آزمون اطمینان دارید؟')) return;
            try {
                const result = await db.deleteExam(parseInt(id));
                if (result.success) loadExams();
                else alert('خطا: ' + result.message);
            } catch (err) {
                alert('خطا: ' + err.message);
            }
        }

        // ========== مدیریت مودال ایجاد آزمون ==========
        // بارگذاری لیست سوالات برای انتخاب دستی
        let allQuestions = [];

        async function loadQuestionsForSelector() {
            try {
                allQuestions = await db.getAllQuestions();
                const select = document.getElementById('questionSelector');
                select.innerHTML = '';
                allQuestions.forEach(q => {
                    const opt = document.createElement('option');
                    opt.value = q.id;
                    opt.textContent = `${q.id} - ${q.question_text.substring(0, 50)}... (${q.difficulty})`;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error('خطا در بارگذاری سوالات:', err);
            }
        }

        // تغییر حالت انتخاب (دستی/تصادفی)
        document.querySelectorAll('input[name="selectionMode"]').forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'manual') {
                    document.getElementById('manualSection').style.display = 'block';
                    document.getElementById('randomSection').style.display = 'none';
                } else {
                    document.getElementById('manualSection').style.display = 'none';
                    document.getElementById('randomSection').style.display = 'block';
                }
            });
        });

        // انتخاب همه / لغو همه
        document.getElementById('selectAllBtn').addEventListener('click', () => {
            const sel = document.getElementById('questionSelector');
            for (let opt of sel.options) opt.selected = true;
        });
        document.getElementById('deselectAllBtn').addEventListener('click', () => {
            const sel = document.getElementById('questionSelector');
            for (let opt of sel.options) opt.selected = false;
        });

        // ارسال فرم
        document.getElementById('examForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('examTitle').value.trim();
            const duration = parseInt(document.getElementById('examDuration').value);
            const desc = document.getElementById('examDesc').value.trim();
            if (!title || !duration) {
                alert('عنوان و مدت زمان الزامی است');
                return;
            }

            const mode = document.querySelector('input[name="selectionMode"]:checked').value;
            const examData = { title, duration, description: desc, shuffle_questions: true, shuffle_options: true };

            try {
                let result;
                if (mode === 'manual') {
                    const select = document.getElementById('questionSelector');
                    const selected = [];
                    for (let opt of select.options) {
                        if (opt.selected) selected.push(parseInt(opt.value));
                    }
                    if (selected.length === 0) {
                        alert('حداقل یک سوال انتخاب کنید');
                        return;
                    }
                    result = await db.createManualExam(examData, selected);
                } else {
                    // تصادفی
                    const category = document.getElementById('randomCategory').value;
                    const total = parseInt(document.getElementById('randomTotal').value);
                    const easy = parseInt(document.getElementById('randomEasy').value) || 0;
                    const medium = parseInt(document.getElementById('randomMedium').value) || 0;
                    const hard = parseInt(document.getElementById('randomHard').value) || 0;
                    if (easy + medium + hard !== total) {
                        alert(`تعداد سوالات (${easy+medium+hard}) با کل (${total}) برابر نیست`);
                        return;
                    }
                    const criteria = {
                        category,
                        difficultyCount: { 'آسان': easy, 'متوسط': medium, 'سخت': hard }
                    };
                    result = await db.createRandomExam(examData, criteria);
                }
                if (result.success) {
                    alert('آزمون با موفقیت ایجاد شد');
                    document.getElementById('createExamModal').querySelector('.btn-close').click();
                    loadExams();
                    // ریست فرم
                    document.getElementById('examForm').reset();
                    document.getElementById('randomEasy').value = 5;
                    document.getElementById('randomMedium').value = 10;
                    document.getElementById('randomHard').value = 5;
                    document.getElementById('randomTotal').value = 20;
                } else {
                    alert('خطا: ' + result.message);
                }
            } catch (err) {
                alert('خطا: ' + err.message);
            }
        });

        // قبل از نمایش مودال، سوالات را بارگذاری کن
        document.getElementById('createExamModal').addEventListener('show.bs.modal', function () {
            loadQuestionsForSelector();
            // حالت پیش‌فرض دستی
            document.getElementById('modeManual').checked = true;
            document.getElementById('manualSection').style.display = 'block';
            document.getElementById('randomSection').style.display = 'none';
        });

        // بارگذاری اولیه
        loadExams();
    </script>
</body>
</html>
