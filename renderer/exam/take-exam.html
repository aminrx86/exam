<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محیط آزمون</title>
    <link rel="stylesheet" href="../css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <!-- مرحله ورود -->
        <div id="loginSection" class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">
            <h4 class="text-center mb-3">ورود به آزمون</h4>
            <form id="participantLoginForm">
                <div class="mb-3">
                    <label class="form-label">نام کامل</label>
                    <input type="text" class="form-control" id="fullName" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">کد کاربری (دریافتی از管理者)</label>
                    <input type="text" class="form-control" id="userCode" placeholder="مثلاً ABC123">
                </div>
                <div class="mb-3">
                    <label class="form-label">کد آزمون</label>
                    <input type="number" class="form-control" id="examId" placeholder="شناسه آزمون" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">شروع آزمون</button>
            </form>
            <div id="loginError" class="alert alert-danger mt-3 d-none"></div>
        </div>

        <!-- مرحله آزمون (پنهان) -->
        <div id="examSection" style="display:none;">
            <div class="exam-container">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 id="examTitle"></h5>
                    <div class="timer" id="timerDisplay">00:00</div>
                </div>
                <div id="questionContainer">
                    <!-- سوالات به صورت پویا -->
                </div>
                <div class="d-flex justify-content-between mt-4">
                    <button class="btn btn-secondary" id="prevBtn">قبلی</button>
                    <span id="questionCounter"></span>
                    <button class="btn btn-primary" id="nextBtn">بعدی</button>
                </div>
                <div class="mt-3">
                    <button class="btn btn-outline-warning" id="markBtn">علامت‌گذاری</button>
                    <button class="btn btn-success" id="submitExamBtn" style="float: left;">پایان آزمون</button>
                </div>
            </div>
        </div>

        <!-- مرحله نتیجه (پنهان) -->
        <div id="resultSection" style="display:none;" class="card shadow p-4">
            <h4 class="text-center">نتیجه آزمون</h4>
            <div id="resultContent"></div>
            <button class="btn btn-primary mt-3" onclick="location.reload()">بازگشت</button>
        </div>
    </div>

    <script>
        const { db } = window.electronAPI;

        // متغیرهای جلسه
        let currentExam = null;
        let currentQuestions = [];
        let currentIndex = 0;
        let answers = {}; // { questionId: selectedOption }
        let participantId = null;
        let timerInterval = null;
        let remainingSeconds = 0;
        let markedQuestions = new Set();

        // عناصر DOM
        const loginSection = document.getElementById('loginSection');
        const examSection = document.getElementById('examSection');
        const resultSection = document.getElementById('resultSection');
        const questionContainer = document.getElementById('questionContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const counterSpan = document.getElementById('questionCounter');
        const markBtn = document.getElementById('markBtn');
        const submitBtn = document.getElementById('submitExamBtn');

        // ========== ورود شرکت‌کننده ==========
        document.getElementById('participantLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const userCode = document.getElementById('userCode').value.trim().toUpperCase();
            const examId = parseInt(document.getElementById('examId').value);
            const errorDiv = document.getElementById('loginError');

            if (!fullName || !examId) {
                errorDiv.textContent = 'نام و کد آزمون الزامی است';
                errorDiv.classList.remove('d-none');
                return;
            }

            try {
                // بررسی کد کاربری (اختیاری)
                let participant = null;
                if (userCode) {
                    participant = await db.getParticipantByCode(userCode);
                    if (!participant) {
                        errorDiv.textContent = 'کد کاربری نامعتبر است';
                        errorDiv.classList.remove('d-none');
                        return;
                    }
                    if (participant.exam_id !== examId) {
                        errorDiv.textContent = 'این کد کاربری برای آزمون دیگری است';
                        errorDiv.classList.remove('d-none');
                        return;
                    }
                    if (participant.status === 'پایان یافته') {
                        errorDiv.textContent = 'شما قبلاً این آزمون را کامل کرده‌اید';
                        errorDiv.classList.remove('d-none');
                        return;
                    }
                    participantId = participant.id;
                } else {
                    // ثبت جدید
                    const result = await db.registerParticipant(fullName, examId);
                    if (!result.success) {
                        errorDiv.textContent = result.message;
                        errorDiv.classList.remove('d-none');
                        return;
                    }
                    const newPart = await db.getParticipantByCode(result.userCode);
                    if (!newPart) {
                        errorDiv.textContent = 'خطا در ثبت شرکت‌کننده. لطفاً دوباره تلاش کنید.';
                        errorDiv.classList.remove('d-none');
                        return;
                    }
                    participantId = newPart.id;
                }

                // بارگذاری آزمون
                const exam = await db.getExamById(examId);
                if (!exam) {
                    errorDiv.textContent = 'آزمون یافت نشد';
                    errorDiv.classList.remove('d-none');
                    return;
                }
                currentExam = exam;
                const questions = await db.getExamQuestions(examId);
                if (questions.length === 0) {
                    errorDiv.textContent = 'آزمون سوالی ندارد';
                    errorDiv.classList.remove('d-none');
                    return;
                }
                // اگر تنظیم shuffle_questions فعال باشد، ترتیب را بهم می‌زنیم
                if (exam.shuffle_questions) {
                    currentQuestions = shuffleArray(questions);
                } else {
                    currentQuestions = questions;
                }

                // شروع آزمون
                loginSection.style.display = 'none';
                examSection.style.display = 'block';
                document.getElementById('examTitle').textContent = exam.title;
                remainingSeconds = exam.duration * 60;
                currentIndex = 0;
                renderQuestion(0);
                startTimer();

            } catch (err) {
                errorDiv.textContent = 'خطا: ' + err.message;
                errorDiv.classList.remove('d-none');
            }
        });

        // ========== توابع کمکی ==========
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ========== رندر سوال ==========
        function renderQuestion(index) {
            const q = currentQuestions[index];
            if (!q) return;
            // اگر shuffle_options فعال باشد، گزینه‌ها را بهم بزنیم (با حفظ کلید اصلی)
            let options = [];
            if (q.question_type === 'چهارگزینه‌ای' || q.question_type === 'چند پاسخ صحیح') {
                const optMap = {
                    'A': q.option_a,
                    'B': q.option_b,
                    'C': q.option_c,
                    'D': q.option_d
                };
                // برای ساده‌سازی، فعلاً ترتیب ثابت است (در صورت نیاز می‌توان shuffle کرد)
                // ولی چون در دیتابیس ذخیره می‌شود، بهتر است در حین ساخت آزمون تعیین شود
                // اینجا فقط برای نمایش
                options = ['A', 'B', 'C', 'D'].filter(key => optMap[key] && optMap[key].trim() !== '');
            }

            let html = `<div class="question-text mb-4">${q.question_text}</div>`;
            if (q.question_type === 'چهارگزینه‌ای' || q.question_type === 'چند پاسخ صحیح') {
                html += `<div class="options-list">`;
                options.forEach(key => {
                    const val = q[`option_${key.toLowerCase()}`];
                    if (val) {
                        const checked = (answers[q.id] && answers[q.id].includes(key)) ? 'checked' : '';
                        html += `
                            <div class="form-check">
                                <input class="form-check-input" type="${q.question_type === 'چند پاسخ صحیح' ? 'checkbox' : 'radio'}" 
                                       name="q${q.id}" value="${key}" id="opt_${q.id}_${key}" ${checked}>
                                <label class="form-check-label" for="opt_${q.id}_${key}">
                                    ${key}. ${val}
                                </label>
                            </div>
                        `;
                    }
                });
                html += `</div>`;
            } else if (q.question_type === 'درست/غلط') {
                const checkedTrue = (answers[q.id] && answers[q.id] === 'صحیح') ? 'checked' : '';
                const checkedFalse = (answers[q.id] && answers[q.id] === 'غلط') ? 'checked' : '';
                html += `
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="q${q.id}" value="صحیح" id="opt_${q.id}_true" ${checkedTrue}>
                        <label for="opt_${q.id}_true">صحیح</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="q${q.id}" value="غلط" id="opt_${q.id}_false" ${checkedFalse}>
                        <label for="opt_${q.id}_false">غلط</label>
                    </div>
                `;
            } else { // تشریحی
                const val = answers[q.id] || '';
                html += `
                    <textarea class="form-control" rows="3" id="q${q.id}_text" placeholder="پاسخ خود را بنویسید...">${val}</textarea>
                `;
            }

            // نمایش وضعیت علامت‌گذاری
            const marked = markedQuestions.has(q.id) ? '⭐' : '';
            html += `<div class="mt-2 small">${marked} ${marked ? 'علامت‌گذاری شده' : ''}</div>`;
            questionContainer.innerHTML = html;

            // اتصال رویدادهای تغییر پاسخ
            if (q.question_type === 'چهارگزینه‌ای' || q.question_type === 'درست/غلط') {
                document.querySelectorAll(`input[name="q${q.id}"]`).forEach(input => {
                    input.addEventListener('change', function() {
                        saveAnswer(q.id, this.value);
                    });
                });
            } else if (q.question_type === 'چند پاسخ صحیح') {
                document.querySelectorAll(`input[name="q${q.id}"]`).forEach(input => {
                    input.addEventListener('change', function() {
                        const checked = document.querySelectorAll(`input[name="q${q.id}"]:checked`);
                        const values = Array.from(checked).map(c => c.value).sort().join(',');
                        saveAnswer(q.id, values);
                    });
                });
            } else { // تشریحی
                const textarea = document.getElementById(`q${q.id}_text`);
                if (textarea) {
                    textarea.addEventListener('input', function() {
                        saveAnswer(q.id, this.value);
                    });
                }
            }

            // بروزرسانی شمارنده
            counterSpan.textContent = `سوال ${index + 1} از ${currentQuestions.length}`;
            prevBtn.disabled = (index === 0);
            nextBtn.textContent = (index === currentQuestions.length - 1) ? 'پایان' : 'بعدی';
        }

        // ========== ذخیره پاسخ ==========
        function saveAnswer(questionId, value) {
            answers[questionId] = value;
            // ذخیره خودکار در دیتابیس (با فرض اینکه پاسخ هنوز تصحیح نشده)
            // برای تعیین صحت، بعداً در پایان محاسبه می‌شود
            db.saveAnswer(participantId, questionId, value, null); // isCorrect بعداً محاسبه می‌شود
        }

        // ========== دکمه‌های قبلی/بعدی ==========
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            } else {
                // آخرین سوال - پایان
                if (confirm('آیا از پایان آزمون اطمینان دارید؟')) {
                    finishExam();
                }
            }
        });

        // ========== علامت‌گذاری ==========
        markBtn.addEventListener('click', () => {
            const q = currentQuestions[currentIndex];
            if (markedQuestions.has(q.id)) {
                markedQuestions.delete(q.id);
            } else {
                markedQuestions.add(q.id);
            }
            renderQuestion(currentIndex);
        });

        // ========== تایمر ==========
        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateTimerDisplay();
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert('زمان آزمون به پایان رسید');
                    finishExam();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            timerDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            if (remainingSeconds < 60) timerDisplay.style.color = 'red';
        }

        // ========== پایان آزمون ==========
        async function finishExam() {
            if (timerInterval) clearInterval(timerInterval);

            // محاسبه نتایج
            let correct = 0, wrong = 0, unanswered = 0;
            const total = currentQuestions.length;
            currentQuestions.forEach(q => {
                const userAns = answers[q.id];
                if (!userAns || userAns.trim() === '') {
                    unanswered++;
                    return;
                }
                // مقایسه با پاسخ صحیح (برای ساده‌سازی، فرض می‌کنیم پاسخ صحیح دقیقاً مطابقت دارد)
                // برای چند پاسخ صحیح، باید split و مقایسه کرد
                let isCorrect = false;
                if (q.question_type === 'چند پاسخ صحیح') {
                    const correctParts = q.correct_answer.split(',').map(s => s.trim()).sort().join(',');
                    const userParts = userAns.split(',').map(s => s.trim()).sort().join(',');
                    isCorrect = (correctParts === userParts);
                } else {
                    isCorrect = (userAns.trim() === q.correct_answer.trim());
                }
                if (isCorrect) correct++;
                else wrong++;
            });

            const score = correct; // هر سوال ۱ نمره
            const percentage = (correct / total) * 100;

            // ذخیره در دیتابیس
            await db.submitExamResult({
                participantId,
                totalCorrect: correct,
                totalWrong: wrong,
                totalUnanswered: unanswered,
                score,
                percentage
            });

            // نمایش نتیجه
            examSection.style.display = 'none';
            resultSection.style.display = 'block';
            document.getElementById('resultContent').innerHTML = `
                <p><strong>تعداد سوالات:</strong> ${total}</p>
                <p><strong>پاسخ صحیح:</strong> ${correct}</p>
                <p><strong>پاسخ غلط:</strong> ${wrong}</p>
                <p><strong>بی‌پاسخ:</strong> ${unanswered}</p>
                <p><strong>نمره:</strong> ${score}</p>
                <p><strong>درصد:</strong> ${percentage.toFixed(2)}%</p>
            `;
        }

        // دکمه پایان آزمون (اختیاری)
        submitBtn.addEventListener('click', () => {
            if (confirm('آیا از پایان آزمون اطمینان دارید؟')) {
                finishExam();
            }
        });

        // ========== مقداردهی اولیه ==========
        // اگر کاربری از قبل لاگین است (مثلاً از لینک مستقیم وارد شده)، می‌توان مسیریابی کرد
        // فعلاً ساده
    </script>
</body>
</html>
